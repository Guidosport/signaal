<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Signaal — AI-nieuws in 5 minuten</title>
  <meta name="description" content="Elke ochtend om 8:00 het belangrijkste AI-nieuws in vijf minuten." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#140A24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Signaal" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main id="app">
    <header class="top">
      <div class="brand"><span class="brand-dot"></span>Signaal</div>
      <div class="sub">AI-nieuws · elke ochtend 8:00</div>
    </header>

    <!-- ===== Speler ===== -->
    <section class="player" id="player">
      <div class="date-line" id="epDate">—</div>
      <h1 class="ep-title" id="epTitle">Even laden…</h1>

      <div class="stage">
        <div class="orb" id="orb">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="core"></div>
          <canvas id="wave" width="560" height="560"></canvas>
          <button class="play" id="playBtn" aria-label="Afspelen" disabled>
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>
          </button>
        </div>
      </div>

      <div class="scrub">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Positie" disabled />
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>

      <div class="controls">
        <button class="ctl" id="back" aria-label="15 seconden terug" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>15</span>
        </button>
        <button class="speed" id="speed" disabled>1×</button>
        <button class="ctl" id="fwd" aria-label="15 seconden vooruit" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><span>15</span>
        </button>
      </div>
    </section>

    <!-- ===== Koppen ===== -->
    <section class="card" id="headlinesCard" hidden>
      <h2>In deze aflevering</h2>
      <ol class="headlines" id="headlines"></ol>
    </section>

    <!-- ===== Archief ===== -->
    <section class="card" id="archiveCard" hidden>
      <h2>Eerdere afleveringen</h2>
      <ul class="archive" id="archive"></ul>
    </section>

    <footer class="foot">Stem: ElevenLabs v4 · Samengesteld door Claude</footer>
  </main>

  <audio id="audio" preload="metadata" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
